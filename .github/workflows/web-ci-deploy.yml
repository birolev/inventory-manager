name: Web CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            quality:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.github/workflows/**'
            web:
              - 'lib/**'
              - 'web/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'supabase.env'
              - 'package.json'
              - 'package-lock.json'
              - '.netlify/**'

  quality:
    name: Analyze and test Flutter
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build-deploy-web:
    name: Build and deploy web
    needs: [changes, quality]
    if: ${{ always() && !cancelled() && needs.changes.outputs.web == 'true' && needs.quality.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Set up Node.js for Netlify CLI
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Netlify CLI dependencies
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm ci

      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npx netlify deploy --dir=build/web --site="$NETLIFY_SITE_ID" --alias="pr-${{ github.event.pull_request.number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx netlify deploy --dir=build/web --site="$NETLIFY_SITE_ID" --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
