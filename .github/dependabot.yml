version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: monthly
    groups:
      flutter-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
